name: Natesclaw
options:
  bundleIdPrefix: ai.natesclawfoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  NatesclawKit:
    path: ../shared/NatesclawKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  Natesclaw:
    shared: true
    build:
      targets:
        Natesclaw: all
    test:
      targets:
        - NatesclawTests
        - NatesclawLogicTests
  NatesclawLogicTests:
    shared: true
    build:
      targets:
        NatesclawLogicTests: all
    test:
      targets:
        - NatesclawLogicTests
  NatesclawUITests:
    shared: true
    build:
      targets:
        NatesclawUITests: all
    test:
      targets:
        - NatesclawUITests
  NatesclawWatchApp:
    shared: true
    build:
      targets:
        NatesclawWatchApp: all

targets:
  Natesclaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: NatesclawShareExtension
        embed: true
      - target: NatesclawActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: NatesclawWatchApp
      - package: NatesclawKit
      - package: NatesclawKit
        product: NatesclawChatUI
      - package: NatesclawKit
        product: NatesclawProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/NatesclawKit/Sources/NatesclawChatUI,$SRCROOT/../shared/NatesclawKit/Sources/NatesclawKit,$SRCROOT/../shared/NatesclawKit/Sources/NatesclawNativeState,$SRCROOT/../shared/NatesclawKit/Sources/NatesclawProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    postBuildScripts:
      - name: Stage Canvas A2UI resources
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          repo_root="$(cd "$SRCROOT/../.." && pwd -P)"
          resource_product="$BUILT_PRODUCTS_DIR/NatesclawKit_NatesclawKit.bundle"
          resource_bundle="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NatesclawKit_NatesclawKit.bundle"
          test -d "$resource_product"
          test -d "$resource_bundle"
          node --import tsx "$repo_root/scripts/sync-native-a2ui.mts" \
            --write \
            --output "$resource_product/CanvasA2UI"
          rm -rf "$resource_bundle/CanvasA2UI"
          cp -R "$resource_product/CanvasA2UI" "$resource_bundle/CanvasA2UI"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(NATESCLAW_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        NATESCLAW_ACTIVE_APP_GROUP_ID: "$(NATESCLAW_APP_GROUP_ID)"
        NATESCLAW_URL_SCHEME: natesclaw
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NATESCLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NATESCLAW_ACTIVE_APP_GROUP_ID: "$(NATESCLAW_DEBUG_APP_GROUP_ID)"
          NATESCLAW_CODE_SIGN_ENTITLEMENTS: Sources/Natesclaw.entitlements
          NATESCLAW_APNS_ENTITLEMENT_ENVIRONMENT: development
          NATESCLAW_URL_SCHEME: natesclaw-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          NATESCLAW_PUSH_MODE: localSandbox
          NATESCLAW_PUSH_RELAY_BASE_URL: ""
        Release:
          NATESCLAW_CODE_SIGN_ENTITLEMENTS: Sources/Natesclaw.entitlements
          NATESCLAW_APNS_ENTITLEMENT_ENVIRONMENT: production
          NATESCLAW_PUSH_MODE: localProduction
          NATESCLAW_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Natesclaw
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.natesclawfoundation.app
            CFBundleURLSchemes:
              - "$(NATESCLAW_URL_SCHEME)"
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        NatesclawCanonicalVersion: "$(NATESCLAW_IOS_VERSION)"
        NatesclawGitCommit: "$(NATESCLAW_GIT_COMMIT)"
        NatesclawBuildTimestamp: "$(NATESCLAW_BUILD_TIMESTAMP)"
        NatesclawAppGroupIdentifier: "$(NATESCLAW_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: Natesclaw discovers and connects to your Natesclaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _natesclaw-gw._tcp
        NSCameraUsageDescription: Natesclaw uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: Natesclaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Natesclaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Natesclaw uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Natesclaw uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Natesclaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Natesclaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Natesclaw uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: Natesclaw may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: Natesclaw reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: Natesclaw does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: Natesclaw lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Natesclaw uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Natesclaw uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NatesclawPushMode: "$(NATESCLAW_PUSH_MODE)"
        NatesclawPushRelayBaseURL: "$(NATESCLAW_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NatesclawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NatesclawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/NatesclawShareExtension.entitlements
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NATESCLAW_ACTIVE_APP_GROUP_ID: "$(NATESCLAW_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NATESCLAW_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          NATESCLAW_ACTIVE_APP_GROUP_ID: "$(NATESCLAW_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Natesclaw Share
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        NatesclawAppGroupIdentifier: "$(NATESCLAW_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  NatesclawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/NatesclawActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NATESCLAW_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Natesclaw Activity
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NatesclawWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotView.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotAnimator.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NatesclawKit
        product: NatesclawKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(NATESCLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(NATESCLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NATESCLAW_COMPANION_APP_BUNDLE_ID: "$(NATESCLAW_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NATESCLAW_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NATESCLAW_COMPANION_APP_BUNDLE_ID: "$(NATESCLAW_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Natesclaw
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(NATESCLAW_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: Natesclaw connects this Apple Watch directly to your Gateway on trusted local networks.
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  NatesclawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: Natesclaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Natesclaw.app/Natesclaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"

  NatesclawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareContentExtractor.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotView.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotAnimator.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/NatesclawMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/NatesclawKit/Sources/NatesclawChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: NatesclawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"

  NatesclawUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Natesclaw
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NATESCLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NATESCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NATESCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Natesclaw
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NATESCLAW_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: NatesclawUITests
        CFBundleShortVersionString: "$(NATESCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NATESCLAW_BUILD_VERSION)"
