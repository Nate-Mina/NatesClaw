services:
  - type: web
    name: natesclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NATESCLAW_GATEWAY_PORT
        value: "8080"
      - key: NATESCLAW_STATE_DIR
        value: /data/.natesclaw
      - key: NATESCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: NATESCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: natesclaw-data
      mountPath: /data
      sizeGB: 1
