services:
  natesclaw-gateway:
    image: ${NATESCLAW_IMAGE:-natesclaw:local}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      NATESCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` (used by Compose for the bind-mount source below) cannot leak
      # into runtime code that resolves these env vars inside the container.
      # Without this override, a macOS host path like /Users/<you>/.natesclaw/...
      # imported from .env caused first-reply `mkdir '/Users'` EACCES failures
      # in Linux Docker (#77436).
      NATESCLAW_STATE_DIR: /home/node/.natesclaw
      NATESCLAW_CONFIG_PATH: /home/node/.natesclaw/natesclaw.json
      NATESCLAW_CONFIG_DIR: /home/node/.natesclaw
      NATESCLAW_WORKSPACE_DIR: /home/node/.natesclaw/workspace
      NATESCLAW_GATEWAY_TOKEN: ${NATESCLAW_GATEWAY_TOKEN:-}
      NATESCLAW_ALLOW_INSECURE_PRIVATE_WS: ${NATESCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # Empty means auto: Bonjour disables itself in detected containers.
      # Set 0 only on host/macvlan/mDNS-capable networks; set 1 to force off.
      NATESCLAW_DISABLE_BONJOUR: ${NATESCLAW_DISABLE_BONJOUR:-}
      # OpenTelemetry export is outbound OTLP/HTTP from the Gateway. Prometheus
      # uses the existing authenticated Gateway route; it does not need a port.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: ${OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: ${OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      NATESCLAW_OTEL_PRELOADED: ${NATESCLAW_OTEL_PRELOADED:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${NATESCLAW_TZ:-UTC}
    volumes:
      - "${NATESCLAW_CONFIG_DIR:-${HOME:-/tmp}/.natesclaw}:/home/node/.natesclaw"
      - "${NATESCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.natesclaw/workspace}:/home/node/.natesclaw/workspace"
      - "${NATESCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.natesclaw-auth-profile-secrets}:/home/node/.config/natesclaw"
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg NATESCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with NATESCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    # Let bundled local-model providers reach host-side LM Studio/Ollama via
    # http://host.docker.internal:<port>. Docker Desktop usually provides this
    # alias; the host-gateway mapping makes it work on Linux Docker Engine too.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NATESCLAW_GATEWAY_PORT:-18789}:18789"
      - "${NATESCLAW_BRIDGE_PORT:-18790}:18790"
      - "${NATESCLAW_MSTEAMS_PORT:-3978}:3978"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${NATESCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "dist/docker-healthcheck.js",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  natesclaw-cli:
    image: ${NATESCLAW_IMAGE:-natesclaw:local}
    network_mode: "service:natesclaw-gateway"
    env_file:
      - path: .env
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      NATESCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` cannot leak into runtime code via the env_file import (#77436).
      NATESCLAW_STATE_DIR: /home/node/.natesclaw
      NATESCLAW_CONFIG_PATH: /home/node/.natesclaw/natesclaw.json
      NATESCLAW_CONFIG_DIR: /home/node/.natesclaw
      NATESCLAW_WORKSPACE_DIR: /home/node/.natesclaw/workspace
      NATESCLAW_GATEWAY_TOKEN: ${NATESCLAW_GATEWAY_TOKEN:-}
      NATESCLAW_ALLOW_INSECURE_PRIVATE_WS: ${NATESCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${NATESCLAW_TZ:-UTC}
    volumes:
      - "${NATESCLAW_CONFIG_DIR:-${HOME:-/tmp}/.natesclaw}:/home/node/.natesclaw"
      - "${NATESCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.natesclaw/workspace}:/home/node/.natesclaw/workspace"
      - "${NATESCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.natesclaw-auth-profile-secrets}:/home/node/.config/natesclaw"
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - natesclaw-gateway
