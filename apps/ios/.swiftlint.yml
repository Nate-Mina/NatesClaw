parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/NatesclawKit/Sources/NatesclawChatUI
  - ../shared/NatesclawKit/Sources/NatesclawKit
  - ../shared/NatesclawKit/Sources/NatesclawNativeState
  - ../shared/NatesclawKit/Sources/NatesclawProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/NatesclawKit/Sources/NatesclawProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  natesclaw_design_colors:
    name: "Natesclaw design colors"
    excluded:
      - Sources/Design/NatesclawBrand.swift
      - ../shared/NatesclawKit/Sources/NatesclawChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use NatesclawBrand or NatesclawChatTheme design tokens instead of raw accent/status colors."
    severity: error
